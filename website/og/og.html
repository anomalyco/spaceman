<!doctype html>
<!-- The og:image. show/tools/stills.ts shoots it at 1200x630 into public/og-image.png. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #0a0b0d; }
      body {
        position: relative;
        font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
        color: #f3f4f6;
        -webkit-font-smoothing: antialiased;
      }
      .study {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 34% 52%;
        filter: saturate(0.9) brightness(0.8);
      }
      /* the dark falls off to the left, where the type sits, and around the edges */
      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgb(8 8 10 / 0.94) 0%, rgb(8 8 10 / 0.86) 30%, rgb(8 8 10 / 0.55) 52%, rgb(8 8 10 / 0.32) 72%, rgb(8 8 10 / 0.4) 100%),
          radial-gradient(120% 90% at 70% 45%, transparent 40%, rgb(8 8 10 / 0.6) 100%);
      }
      .type {
        position: absolute;
        left: 76px;
        top: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0;
      }
      .icon { width: 84px; height: 84px; margin-bottom: 30px; filter: drop-shadow(0 10px 24px rgb(0 0 0 / 0.5)); }
      h1 { font-size: 108px; line-height: 0.95; font-weight: 650; letter-spacing: -0.045em; }
      p.line { margin-top: 18px; font-size: 46px; line-height: 1.1; font-weight: 500; letter-spacing: -0.025em; color: #c4c6cc; }
      .url { position: absolute; left: 78px; bottom: 50px; font-size: 21px; font-weight: 500; letter-spacing: -0.005em; color: #8b8e96; }
      .screen {
        position: absolute;
        left: 612px;
        top: 112px;
        width: 664px;
        height: 415px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 0 0 1px rgb(255 255 255 / 0.12), 0 2px 4px rgb(0 0 0 / 0.4), 0 40px 90px -20px rgb(0 0 0 / 0.85);
      }
      .screen img { display: block; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <img class="study" src="../public/show/renders/intro.jpg" alt="" />
    <div class="shade"></div>
    <div class="screen"><img src="screen.jpg" alt="" /></div>
    <div class="type">
      <img class="icon" src="../public/icon-512.png" alt="" />
      <h1>Spaceman</h1>
      <p class="line">For your windows.</p>
    </div>
    <p class="url">anoma.ly/spaceman</p>
  </body>
</html>
