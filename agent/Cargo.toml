[package]
name = "spaceman-agent"
version = "0.3.2"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Spaceman's macOS menu-bar and Rune host"
publish = false

[dependencies]
spaceman = { path = ".." }
procwatch = { git = "https://github.com/anomalyco/rune", rev = "c8554efe04ab540ecd02df14eb1bea1d299df932" }
rune = { git = "https://github.com/anomalyco/rune", rev = "c8554efe04ab540ecd02df14eb1bea1d299df932" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "c8554efe04ab540ecd02df14eb1bea1d299df932" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "c8554efe04ab540ecd02df14eb1bea1d299df932" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "c8554efe04ab540ecd02df14eb1bea1d299df932" }
toml_edit = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSAccessibility",
  "NSApplication",
  "NSBitmapImageRep",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSRunningApplication",
  "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSFileManager",
  "NSGeometry",
  "NSRunLoop",
  "NSString",
  "NSTimer",
  "NSURL",
] }

[lints]
workspace = true
