action = "route"
workspace = "M"

[[rules]]
bundle_id = "com.tinyspeck.slackmacgap"
action = "route"
workspace = 2

[[rules]]
bundle_id = "local.lamplight.arachnid"
action = "route"
workspace = "5"

[[rules]]
bundle_id = "local.lamplight.paper-study"
action = "route"
workspace = "5"

[[rules]]
bundle_id = "local.lamplight.paper-proof"
action = "route"
workspace = "5"

[[rules]]
bundle_id = "local.lamplight.paper-escape"
action = "route"
workspace = "5"

[[rules]]
