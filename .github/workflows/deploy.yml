name: Deploy

# Builds website/ and deploys its Worker (the site at /spaceman and the
# release-service download redirect at /spaceman/download/*). A push (or a
# dispatch) on dev deploys the dev site (https://dev.anoma.ly/spaceman/); on
# production, which moves only by a fast-forward from dev, the production site
# (https://anoma.ly/spaceman/). The mode always follows the branch. Split like
# Release (docs/releasing.md):
#
# - build runs repository code (bun install, vite build, prerender) with no
#   environment and no secrets, and uploads worker.ts and dist/ with a
#   SHA256SUMS whose digest it reports.
# - deploy runs in the mode's environment (dev or production, each admitting
#   only its own branch) and mints a short-lived Cloudflare token for that
#   mode's Worker from the token issuer after assuming the environment's role,
#   github/spaceman-<mode> (.github/release/cloudflare-token.sh). The AWS
#   session is a step output given only to the token step, and the token only
#   to the Deploy step. It checks out only .github/release/, verifies the
#   artifact against that digest, and runs only .github/release/deploy-site.sh,
#   which generates a pinned wrangler.jsonc (Worker name, account,
#   compatibility flags, assets binding, and routes) and deploys with the
#   wrangler CLI locked in .github/release/wrangler/.
# - verify checks the live site, download redirect, checksum, and static
#   metadata endpoints without secrets.
on:
  push:
    branches: [dev, production]
    paths:
      - "website/**"
      - "skills/spaceman-setup/SKILL.md"
      - ".github/workflows/deploy.yml"
      - ".github/release/deploy-site.sh"
      - ".github/release/cloudflare-token.sh"
      - ".github/release/wrangler/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build
        run: |
          bun run build
          rm -rf "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/site"
          cp worker.ts "$RUNNER_TEMP/site/worker.ts"
          cp -R dist "$RUNNER_TEMP/site/dist"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: site-${{ github.ref_name == 'production' && 'production' || 'dev' }}
          path: ${{ runner.temp }}/site
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'production' && 'production' || 'dev' }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: site-deploy-${{ github.ref_name == 'production' && 'production' || 'dev' }}
      cancel-in-progress: false
    env:
      MODE: ${{ github.ref_name == 'production' && 'production' || 'dev' }}
    steps:
      - name: Require the branch for the mode
        env:
          REF: ${{ github.ref }}
        run: |
          case "$MODE:$REF" in
            production:refs/heads/production | dev:refs/heads/dev) ;;
            *) echo "::error::The $MODE site deploys only from its own branch, not $REF."; exit 1 ;;
          esac
      - name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Nothing from the Actions cache, which jobs running repository code share.
          package-manager-cache: false
      - name: Install the pinned wrangler CLI
        working-directory: .github/release/wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download
        uses: ./.github/release/download
        with:
          pattern: site-${{ env.MODE }}
          digests: site-${{ env.MODE }}=${{ needs.build.outputs.digest }}
      # Step outputs only: the token step gets the AWS session, and wrangler in
      # the Deploy step never does.
      - id: aws
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/spaceman-${{ env.MODE }}
          role-session-name: spaceman-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true
      - name: Cloudflare token
        id: cloudflare-token
        env:
          CLOUDFLARE_TOKEN_URL: ${{ vars.CLOUDFLARE_TOKEN_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        run: bash .github/release/cloudflare-token.sh
      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare-token.outputs.token }}
        run: bash .github/release/deploy-site.sh "$MODE" "$RUNNER_TEMP/in/site-$MODE"

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MODE: ${{ github.ref_name == 'production' && 'production' || 'dev' }}
    steps:
      - name: Check the live site and download endpoints
        run: |
          host=$([ "$MODE" = dev ] && echo dev.anoma.ly || echo anoma.ly)
          base="https://$host/spaceman"
          for _ in 1 2 3 4 5 6; do
            status=$(curl --silent --max-time 20 --output /dev/null --write-out '%{http_code}' "$base/")
            [ "$status" = 200 ] && break
            sleep 10
          done
          test "$status" = 200

          headers=$(curl --silent --show-error --max-time 20 --dump-header - --output /dev/null "$base/download/macos-arm64")
          dl_status=$(printf '%s\n' "$headers" | awk 'NR==1 { print $2 }')
          location=$(printf '%s\n' "$headers" | awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); print $2; exit }')
          echo "download/macos-arm64 -> $dl_status $location"
          [ "$dl_status" = 302 ] || { echo "::error::Expected 302 from $base/download/macos-arm64, got $dl_status"; exit 1; }
          [[ "$location" =~ ^https://anoma\.ly/release/spaceman/desktop/(stable|dev)/macos-arm64$ ]] || {
            echo "::error::Unexpected redirect target: $location"
            exit 1
          }

          sha_body=$(curl --fail --silent --show-error --max-time 20 "$base/download/macos-arm64.sha256")
          echo "download/macos-arm64.sha256 -> $sha_body"
          [[ "$sha_body" =~ ^[0-9a-f]{64}[[:space:]]+Spaceman\.zip$ ]] || {
            echo "::error::Unexpected sha256 response: $sha_body"
            exit 1
          }

          for asset in og-image.png llms.txt skill.md; do
            code=$(curl --silent --max-time 20 --output /dev/null --write-out '%{http_code}' "$base/$asset")
            echo "$asset -> $code"
            [ "$code" = 200 ] || { echo "::error::Expected 200 from $base/$asset, got $code"; exit 1; }
          done
